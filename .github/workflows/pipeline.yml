name: pipeline

# Конвейер X5: сбор живых входов → тесты такта → сборка выпуска → проверка
# контракта → публикация в орфан-ветку data → сверка через боевую дверь.
# Любой упавший шаг — ветка data не трогается, на витрине прежний выпуск;
# красный прогон — письмо GitHub владельцу. Секретов не нужно: GITHUB_TOKEN.
# Публикует только main. Порядок действий оператора — ops/README.md.
on:
  schedule:
    # По будням 16:50 UTC (19:50 МСК) — после основной сессии MOEX.
    - cron: "50 16 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "model/**"
      - "data/**"
      - "indicators/**"
      - "ops/**"
      - "requirements.txt"
      - "!**/*.md"

permissions:
  actions: write     # keepalive расписания
  contents: write    # push в ветку data

# Один конвейер одновременно; идущий не отменяется (он может быть на шаге
# публикации).
concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: utf-8
  # «Сегодня» прогона — день по Москве: ядро (model.book.today) и сборщики
  # (indicators.live.msk_today) считают его сами по фиксированному UTC+3, от
  # пояса машины не зависят. TZ — только для отметок времени инструментов
  # (пояс в дате коммита ветки data); дату выпуска он не определяет.
  TZ: Europe/Moscow
  PUBLIC_DATA_URL: https://tzi-850-x5.pages.dev/api/model

jobs:
  pipeline:
    # Ручной запуск с другой ветки не публикует неслитый код в боевую data.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          # Токен не оставляется в git-конфиге: публикация берёт GITHUB_TOKEN
          # из окружения только в своих шагах.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Зависимости
        run: |
          if python -m pip install --quiet -r requirements.txt; then
            echo "- готово: зависимости из requirements.txt" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ПРОВАЛ на шаге зависимости: pip install -r requirements.txt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Состояние из ветки data
        # latest.json (прошлый выпуск: эталон цены, защита заголовка),
        # journal.json, history.json и коммит ветки (.commit — для публикации).
        # Ветки ещё нет — первый выпуск.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python ops/publish.py --fetch-state var/state

      - name: Сбор живых входов
        run: |
          args=(--out var/live/live.json)
          if [ -f var/state/latest.json ]; then args+=(--previous var/state/latest.json); fi
          python -m indicators.live "${args[@]}"

      - name: Тесты такта
        # -rs: причина каждого пропуска — в журнале шага и строкой в сводке (на раннере
        # пропускается тест пересборки фактов с меткой primary: первички здесь нет).
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/tact-tests.log"
          if python -m pytest -q -rs -m "not network and not ci_only and not docs" 2>&1 | tee "$log"; then
            echo "- готово: тесты такта" >> "$GITHUB_STEP_SUMMARY"
            { grep '^SKIPPED' "$log" || true; } | sed 's/^SKIPPED /- пропуск теста такта: /' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ПРОВАЛ на шаге тесты такта: упавшие тесты — в журнале шага" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Сборка выпуска
        run: |
          args=(--live-file var/live/live.json --out var/release/latest.json)
          if [ -f var/state/latest.json ]; then args+=(--previous var/state/latest.json); fi
          if [ -f var/state/journal.json ]; then args+=(--journal var/state/journal.json); fi
          # history.json: книга каждого опубликованного выпуска — для journal.releases
          if [ -f var/state/history.json ]; then args+=(--history var/state/history.json); fi
          python ops/build_release.py "${args[@]}"

      - name: Проверка контракта
        run: python ops/build_release.py --check var/release/latest.json

      - name: Код прогона и голова main
        # Повтор прогона (Re-run) идёт на исходном коммите. Если main ушёл вперёд правкой
        # того, что собирает выпуск (пути push-триггера: model/, data/, indicators/, ops/,
        # requirements.txt, кроме *.md), выпуск на устаревшем коде не публикуется — провал,
        # ветка data не тронута; новый код публикует свой прогон (push по этим путям его
        # запускает; иначе — gh workflow run pipeline.yml). Правки вне этих путей (документы,
        # витрина, тесты) публикации не мешают.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fail() { echo "- ПРОВАЛ на шаге код прогона и голова main: $1" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          main_sha=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          [ -n "$main_sha" ] || fail "голова main не прочитана (git ls-remote)"
          if [ "$main_sha" = "$GITHUB_SHA" ]; then
            echo "- готово: код прогона ${GITHUB_SHA:0:7} = голова main" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$main_sha" --jq '.status, .files[]?.filename') \
            || fail "сравнение ${GITHUB_SHA:0:7}...${main_sha:0:7} не прочитано"
          status=$(printf '%s\n' "$compare" | head -n 1)
          stale=$(printf '%s\n' "$compare" | tail -n +2 \
            | grep -E '^(model|data|indicators|ops)/|^requirements\.txt$' | grep -v '\.md$' || true)
          if [ "$status" != ahead ] || [ -n "$stale" ]; then
            fail "main ушёл вперёд (${main_sha:0:7}) — выпуск на устаревшем коде ${GITHUB_SHA:0:7} не публикуется; повтор прогона — gh workflow run pipeline.yml, не Re-run"
          fi
          echo "- готово: main впереди (${main_sha:0:7}) только правками вне конвейера — публикуется выпуск на коде ${GITHUB_SHA:0:7}" >> "$GITHUB_STEP_SUMMARY"

      - name: Публикация в ветку data
        # Ветка изменилась после шага «Состояние из ветки data» (ручной откат,
        # переоткрытие записи) — провал, ветка не тронута.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python ops/publish.py --release var/release/latest.json --expect-commit "$(cat var/state/.commit)"

      - name: Сверка через боевую дверь
        # raw.githubusercontent.com кэширует до 5 мин: до 20 попыток × 30 с.
        run: python ops/publish.py --verify "$PUBLIC_DATA_URL" --release var/release/latest.json

      - name: Сырые ответы и выпуск прогона
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            var/raw
            var/live
            var/release
          retention-days: 14
          if-no-files-found: ignore

      - name: Keepalive расписания
        # Против отключения расписания через 60 дней без активности репозитория:
        # включение уже включённого workflow (как keepalive-workflow). Отключённый
        # (вручную или GitHub) не включается: включает только владелец.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/${{ github.repository }}/actions/workflows/pipeline.yml" --jq .state)
          if [ "$state" = active ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pipeline.yml/enable"
            echo "- готово: keepalive расписания" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- keepalive: workflow в состоянии $state — не включаю (включает владелец)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
