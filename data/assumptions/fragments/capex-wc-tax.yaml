# Фрагмент книги X5 — области «CAPEX И АМОРТИЗАЦИЯ», «ОБОРОТНЫЙ КАПИТАЛ, КАССА, АРЕНДА», «НАЛОГ»
# (capex-wc-tax). Только ключи своих областей в структуре assumptions.draft.yaml плюс предложение
# financing.cash_buffer_pct. Обоснования — data/assumptions/sections/capex-wc-tax.md,
# расчёты — data/assumptions/evidence/capex-wc-tax/ (capex.py, wc_cash_lease.py, tax.py).
# Цены — уровень ИПЦ 1П2026 (цены якоря); доли — к выручке; деньги — млрд ₽, площадь — тыс. м².

capex:                                              # A-K1…A-K7
  maintenance:                                      # A-K1: поддерживающий без открытий (замещающие — через A-K3) и без инфраструктуры роста (A-K4)
                                                    # 2П2026–2027 = LTM-остаток тождества 2П2025+1П2026 с прочими инвестиционными платежами нетто
                                                    # (ОДДС стр. 42 − 41) — 2,82 %; LT = снизу вверх в ценах и на площади якоря к выручке якоря LTM
                                                    # (цикл 12,5/10/8 лет, автопарк 10/8/7 лет, РЦ, IT, CVP, прочие платежи 0,16 %);
                                                    # low/high = base × стационар уровня / базовый (capex.py, разделы 7–8)
    low:  {"2026H2": 0.0236, "2027": 0.0236, "LT": 0.0244, "LT_from": 2029}
    base: {"2026H2": 0.0282, "2027": 0.0282, "LT": 0.0293, "LT_from": 2029}
    high: {"2026H2": 0.0346, "2027": 0.0346, "LT": 0.0359, "LT_from": 2029}
  maintenance_area_share: 0.65                      # φ: магазины 1,58 + РЦ 0,18 + CVP 0,15 из 2,93 п.п. базового стационара
  price_per_m2: 0.0555                              # A-K3: 55,5 тыс. ₽ на м² валового открытия (2024: 57,2; 2025: 54,0 в ценах якоря)
  infra_per_m2: 0.0278                              # A-K4: автопарк 9,7 + ⅔ × РЦ 27,2 тыс. ₽ на м² чистого прироста
  infra_from_year: 2026                             # РЦ строятся сейчас (10 в работе на 2026–2027), запаса мощностей нет
  asset_life_years: 7                               # A-K6: несмещённая подгонка когорт к D&A 1П2023–1П2026 (среднее модель/факт 1,005)
  disposal_proceeds_pct: 0.00055                    # A-K7: остаточная стоимость выбывших ОС = 0,06 % × (1 − прибыль от выбытия 8,0 % поступлений)

joint:
  capex_prob_given_regime:                          # A-P3: в стрессе режут вложения (2022: 2,88 %; 1П2026: 3,74 % при прогнозе 4,5–4,7 %)
    stress:  {low: 0.30, base: 0.55, high: 0.15}
    floor:   {low: 0.20, base: 0.60, high: 0.20}
    partial: {low: 0.20, base: 0.60, high: 0.20}
    full:    {low: 0.15, base: 0.60, high: 0.25}

working_capital:                                    # A-W1…A-W4
  nwc_pct: {"2026": -0.0364, "LT": -0.0350, "LT_from": 2028}   # A-W1: NWC_op (всё, что идёт через операционный поток) к годовой выручке на 31.12;
                                                    # 2026 = якорь 30.06.2026 −3,34 % − излишек 0,30; LT = среднее декабрей 2023–2025 и ожидания 2026.
                                                    # ТРЕБУЕТ facts.balance.nwc в том же определении: −163,156 млрд ₽ на 30.06.2026
  h1_excess_pct: 0.003                              # A-W2: июнь выше декабря на 0,32 п.п. (17 наблюдений; медиана 0,27)
  operating_cash_pct: 0.0106                        # A-W3: кассы магазинов + деньги в пути 0,80 % + минимальный остаток текущих счетов 0,25 %
  lease_adj_pct: -0.0005                            # A-W4: + расход IAS 17 − денежная аренда; 2П2023–1П2026 взвешенно −0,049 %

tax:                                                # A-T1, A-T2
  rate: 0.25                                        # ставка налога на прибыль с 2025 г.
  permanent_add_pct: 0.0017                         # постоянные разницы к базе: сверка ставок МСФО 2023–2025 и ставка 1П2026, взвешенно

financing:
  cash_buffer_pct: 0.0045                           # ПРЕДЛОЖЕНИЕ (A-F3b): ликвидность без дивидендов к выплате 1,51 % (30.06.2025–30.06.2026) − операционная касса 1,06 %

axes_proposals:
  - {name: "Поддерживающий capex (сдвиг всех уровней)", kind: shift,
     paths: [capex.maintenance.low, capex.maintenance.base, capex.maintenance.high], low: -0.004, high: 0.004}
  - {name: "Стоимость открытия, млрд ₽ на тыс. м²", kind: value, paths: [capex.price_per_m2], low: 0.047, high: 0.064}
  - {name: "Инфраструктура на м² прироста, млрд ₽ на тыс. м²", kind: value, paths: [capex.infra_per_m2], low: 0.019, high: 0.037}
  - {name: "Оборотный капитал, долгосрочный уровень (сдвиг)", kind: shift, paths: [working_capital.nwc_pct.LT], low: -0.005, high: 0.005}
  - {name: "Операционная касса", kind: value, paths: [working_capital.operating_cash_pct], low: 0.006, high: 0.0145}
  - {name: "Постоянные налоговые разницы", kind: value, paths: [tax.permanent_add_pct], low: -0.0013, high: 0.0045}

reverse_dcf_proposals:
  - {name: "Поддерживающий capex (сдвиг всех уровней)", kind: shift,
     paths: [capex.maintenance.low, capex.maintenance.base, capex.maintenance.high],
     search: [-0.02, 0.04], range: [-0.004, 0.004], unit: "п.п."}
  - {name: "Стоимость открытия, млрд ₽ на тыс. м²", kind: value, paths: [capex.price_per_m2],
     search: [0.0, 0.20], range: [0.047, 0.064], unit: "млрд ₽/тыс. м²"}
