# Письменные объяснения сработавших гейтов правдоподобия (docs/MODEL.md §13.2).
#
# Гейт — не ошибка, а место, где модель расходится с историей или с рынком.
# Расходиться можно, не замечать — нельзя: сработавший гейт без действующей
# записи здесь роняет сборку выпуска.
#
# Формат записи (все три ключа обязательны, других ключей нет):
#
#   ключ_гейта:                      # ev_ebitda | margin_range | capex_range | terminal_share |
#                                    # real_rate | leverage_path | equity_cushion
#     explanation: >-
#       Текст для человека: где и почему срабатывает, почему это не ошибка книги.
#     expected_mass: [0.05, 0.20]    # коридор массы (доли 0…1): суммарная вероятность клеток
#                                    # слоя «свой макро-взгляд», где условие нарушено
#     valid_until: "2027-04-30"      # объяснение действует ВКЛЮЧИТЕЛЬНО по эту дату
#
# Сборка падает, если гейт сработал и: записи нет; срок истёк; масса вне
# коридора `expected_mass` (объяснение описывает не ту картину). Незнакомый
# ключ гейта или записи — ошибка чтения файла (model/checks.py).
#
# Массы и срабатывания на входах книги печатает `python -B -m model.book_results`
# (data/assumptions/run_output.txt, раздел «Гейты»).

ev_ebitda:
  explanation: >-
    Срабатывает в двух хвостах (EV клетки к скорр. EBITDA следующих 12 мес.). Снизу — клетки
    «стресс × высокий capex» (≈1,4–1,5× у низа коридора 1,5×; все три мира весят 0,062 =
    P(стресс) 0,415 × P(высокий capex | стресс) 0,15): маржа стресса (цель LT 5,2 %) при высоком
    поддерживающем capex (3,6 % выручки в стационаре) оставляет свободный поток около нуля, и EV
    клетки почти равна долгу. Сверху — мир M: partial/full при низком capex и full при базовом
    (5,8–7,3× при коридоре до 5,5×; floor·low — 5,3×, у края), и N·full·low (≈8,4× при коридоре
    до 8,0×). В мире M
    причина — сам мир: его центральные клетки (floor·base ≈4,5×, partial·base ≈5,0×) уже выше
    всей истории режима высоких ставок (NTM 3,1–4,3×, 2023–2026 гг.), потому что модель не
    переносит нынешний ценовой дисконт X5 (2,8× на 25.09.2026) в стоимость; снижения capex до
    нижнего уровня хватает, чтобы выйти за коридор 1,25 × 4,32. N·full·low — маржа как в лучшие
    годы X5 (7,15 %) при capex у нижней границы. Это не ошибка книги: обе стороны — хвостовые
    сочетания осей (X5 под давлением режет вложения — поэтому стресс редко идёт с высоким capex,
    A-P3); центральные клетки миров N и H (floor/partial × base) — 4,0–5,5×, внутри коридоров.
  expected_mass: [0.02, 0.12]
  valid_until: "2027-04-30"

equity_cushion:
  explanation: >-
    Может сработать в клетках «стресс × высокий capex» (капитал клетки у нуля: EV ≈ долгу, см.
    ev_ebitda снизу; мир H — 0,028, все три мира — 0,062). Это хвостовое сочетание осей, а не
    ошибка книги; цена клетки считается по той же формуле, что и у слоя (капитал + выручка от
    продажи казначейского пакета на выпущенные акции), а слои далеко от предела: V0/D ≈ 3,0 при
    пределе 1,5, кредитный пут слоя — доли рубля на акцию, поэтому возврат к структурной оценке
    для цены не нужен.
  expected_mass: [0.01, 0.07]
  valid_until: "2027-04-30"
