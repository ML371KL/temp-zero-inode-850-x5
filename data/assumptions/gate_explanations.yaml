# Письменные объяснения сработавших гейтов правдоподобия (docs/MODEL.md §13.2).
#
# Гейт — не ошибка, а место, где модель расходится с историей или с рынком.
# Расходиться можно, не замечать — нельзя: сработавший гейт без действующей
# записи здесь роняет сборку выпуска.
#
# Формат записи (все три ключа обязательны, других ключей нет):
#
#   ключ_гейта:                      # ev_ebitda | margin_range | capex_range | terminal_share |
#                                    # real_rate | leverage_path | equity_cushion
#     explanation: >-
#       Текст для человека: где и почему срабатывает, почему это не ошибка книги.
#     expected_mass: [0.05, 0.20]    # коридор массы (доли 0…1): суммарная вероятность клеток
#                                    # слоя «свой макро-взгляд», где условие нарушено
#     valid_until: "2027-04-30"      # объяснение действует ВКЛЮЧИТЕЛЬНО по эту дату
#
# Сборка падает, если гейт сработал и: записи нет; срок истёк; масса вне
# коридора `expected_mass` (объяснение описывает не ту картину). Незнакомый
# ключ гейта или записи — ошибка чтения файла (model/checks.py).
#
# Массы и срабатывания на входах книги печатает `python -B -m model.book_results`
# (data/assumptions/run_output.txt, раздел «Гейты»).

ev_ebitda:
  explanation: >-
    Срабатывает в двух хвостах (EV клетки к скорр. EBITDA следующих 12 мес.). Снизу — клетки
    «Стресс» при высоком capex в мирах «Нормализация» (1,47×, вес 0,022) и «Высокие ставки надолго»
    (1,35×, вес 0,028) при низе коридора 1,5×; в мире «Рыночный как есть» та же клетка у края и не
    срабатывает (1,50×; все три вместе весят 0,062 = P(стресс) 0,415 × P(высокий capex | стресс)
    0,15): маржа стресса (цель LT 5,2 %) при высоком поддерживающем capex (3,6 % выручки в
    стационаре) оставляет свободный поток около нуля, и EV клетки почти равна долгу. Сверху — мир
    «Рыночный как есть»: «Частичный возврат» и «Полный возврат» при низком capex и «Полный возврат»
    при базовом (5,8–7,3× при коридоре до 5,5×; «Дно» при низком capex — 5,3×, у края), и мир
    «Нормализация»: «Полный возврат» при низком capex (≈8,4× при коридоре до 8,0×). В мире «Рыночный
    как есть» причина — сам мир: его центральные клетки («Дно» и «Частичный возврат» при базовом
    capex, ≈4,5× и ≈5,0×) уже выше всей истории режима высоких ставок (NTM 3,1–4,3×, 2023–2026 гг.),
    потому что модель не переносит нынешний ценовой дисконт X5 (2,8× на 25.09.2026) в стоимость;
    снижения capex до низкого уровня хватает, чтобы выйти за коридор 1,25 × 4,32. «Полный возврат» при
    низком capex в мире «Нормализация» — маржа как в лучшие годы X5 (7,15 %) при capex у нижней
    границы. Это не ошибка книги: обе стороны — хвостовые сочетания осей (X5 под давлением режет
    вложения, поэтому стресс редко идёт с высоким capex — суждение A-P3); центральные клетки миров
    «Нормализация» и «Высокие ставки надолго» («Дно» и «Частичный возврат» при базовом capex) —
    3,9–5,5×, внутри коридоров.
  expected_mass: [0.02, 0.12]
  valid_until: "2027-04-30"

equity_cushion:
  explanation: >-
    Срабатывает в клетке «Стресс» при высоком capex мира «Высокие ставки надолго»: капитал клетки
    чуть ниже нуля (−3,0 млрд ₽ при EV 425 млрд ₽ — EV почти равна долгу, как в нижнем хвосте гейта
    EV / EBITDA), вес клетки 0,028. В мирах «Нормализация» и «Рыночный как есть» те же клетки у нуля,
    но выше него (34 и 45 млрд ₽); все три вместе весят 0,062. Это хвостовое сочетание осей, а не
    ошибка книги: цена клетки считается по той же формуле, что и у слоя (капитал + выручка от продажи
    казначейского пакета на выпущенные акции), и остаётся положительной (≈140 ₽), а слои далеко от
    предела: V0/D ≈ 3,0 при пределе 1,5, кредитный пут слоя — доли рубля на акцию, поэтому возврат к
    структурной оценке для цены не нужен.
  expected_mass: [0.01, 0.07]
  valid_until: "2027-04-30"
