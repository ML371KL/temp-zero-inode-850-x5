# Записки о задуманных скачках заголовка (docs/MODEL.md §13.4; проверка — model/payload.py::validate).
#
# Скачок печатаемой медианы больше 25 % или EV медианы (V0) больше 10 % против прошлого выпуска
# роняет сборку, если с прошлого выпуска не сменились версия книги (meta.book_version) или дата
# фактов (meta.facts_date) и нет действующей записки. На витрине тогда остаётся прежний выпуск.
#
# Записка — предсказание, которое сборка проверяет, а не разрешение на любой скачок:
#   - date: "ГГГГ-ММ-ДД"            когда написана
#     reason: "текст"               что поменялось и почему скачок задуман (правка кода, данных)
#     expected_median: 0            ожидаемая ТОЧНАЯ медиана выпуска после правки, ₽ (headline.central)
#     tolerance_pct: 5              допуск к expected_median, %, (0; 25]; по умолчанию 5
#     valid_until: "ГГГГ-ММ-ДД"     обязательный срок: бессрочная записка — ошибка сборки
#
# Записка действует, пока valid_until не прошёл (включительно), и только если медиана выпуска
# попала в expected_median ± tolerance_pct. Записка без expected_median или без valid_until —
# ошибка сборки всегда, даже без скачка.

