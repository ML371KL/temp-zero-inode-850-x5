[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
addopts = --strict-markers -p no:cacheprovider
markers =
    network: ходит в сеть; запускается только при X5_NETWORK=1
    ci_only: только в CI (переменная окружения CI)
    primary: нужны первичка рядом с репозиторием и openpyxl (сборщик фактов); без них — пропуск с причиной
    docs: сверка документов с кодом и выпуском
    slow: долгий тест (полоса, обратный DCF); отбор: -m "not slow"
filterwarnings =
    ignore::model.book.BookFallbackWarning
    ignore::model.facts.FactsFallbackWarning
